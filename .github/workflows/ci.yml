name: CI

env:
  CI_NODE_VERSION: "24"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # GitHub Spark still publishes a Vite 6/7 peer range while this repo is locked on Vite 8.
        run: npm ci --legacy-peer-deps

      - name: Run repo quality contract
        run: npm run check
